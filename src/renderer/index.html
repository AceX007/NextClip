<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';" />
  <title>NextClip</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="titlebar">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6.5" y="4.2" width="11" height="15.6" rx="2"/>
          <path d="M9 4.2h6V6a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V4.2z"/>
          <path d="M9.5 12h5M9.5 15.2h3.2"/>
        </svg>
      </span>
      <span class="brand-copy">
        <span class="brand-name">NextClip</span>
        <span class="brand-status">
          <span class="dot" id="statusDot"></span>
          <span class="brand-sub" id="statusText">Locked</span>
        </span>
      </span>
    </div>
    <div class="titlebar-actions">
      <button id="btnShot" class="icon-btn" title="Screenshot a region (Ctrl+Shift+S)" aria-label="Screenshot a region">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8.5A2 2 0 0 1 5 6.5h2.2l1.2-2h7.2l1.2 2H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <circle cx="12" cy="13" r="3.4"/>
        </svg>
      </button>
      <button id="btnLock" class="icon-btn" title="Lock now (Ctrl+L)" aria-label="Lock vault">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/>
          <path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/>
          <circle cx="12" cy="15.5" r="1.2" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button id="btnSettings" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/>
          <circle cx="16" cy="7" r="2.1"/><circle cx="10" cy="17" r="2.1"/>
        </svg>
      </button>
      <button id="btnClose" class="icon-btn danger" title="Hide (Esc)" aria-label="Hide panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
        </svg>
      </button>
    </div>
  </header>

  <section id="lockScreen" class="lock-screen hidden">
    <div class="lock-inner">
      <div class="lock-art" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="5" y="10.2" width="14" height="10" rx="2.4" stroke="currentColor" stroke-width="1.6"/>
          <path d="M8 10.2V7.8a4 4 0 0 1 8 0v2.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="12" cy="15" r="1.15" fill="currentColor"/>
          <path d="M12 16.2v2.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 id="lockTitle">Unlock your vault</h1>
      <p id="lockHint" class="muted">Your clipboard history is encrypted with AES-256-GCM.</p>
      <form id="passForm" autocomplete="off">
        <input id="passInput" type="password" placeholder="Passphrase" aria-label="Passphrase" autocomplete="current-password" spellcheck="false" />
        <input id="passConfirm" type="password" placeholder="Repeat passphrase" aria-label="Repeat passphrase" autocomplete="new-password" spellcheck="false" class="hidden" />
        <div class="remember-row">
          <label class="remember-copy">
            <input id="rememberMe" class="remember-check" type="checkbox" />
            <span>Remember me for</span>
          </label>
          <input id="rememberDays" class="remember-days" type="number" min="1" max="90" step="1" value="1" inputmode="numeric" aria-label="Days to remember this login" />
          <span class="remember-suffix">days</span>
        </div>
        <button id="passSubmit" type="submit" class="primary">Unlock</button>
      </form>
      <p id="lockError" class="error hidden" role="alert"></p>
      <p class="muted tiny" id="lockFootnote"></p>
    </div>
  </section>

  <section id="historyScreen" class="history hidden">
    <div class="toolbar">
      <div class="finder">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input id="search" type="search" placeholder="Search history" aria-label="Search clipboard history" spellcheck="false" />
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
          <button id="searchClear" class="search-clear" title="Clear search" aria-label="Clear search">
            <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M3 3l6 6M9 3L3 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="seg" id="seg" role="group" aria-label="Filter clipboard history">
          <div class="seg-indicator" aria-hidden="true"></div>
          <button class="chip active" data-filter="all" aria-pressed="true">All<span class="count" data-count="all"></span></button>
          <button class="chip" data-filter="text" aria-pressed="false">Text<span class="count" data-count="text"></span></button>
          <button class="chip" data-filter="image" aria-pressed="false">Images<span class="count" data-count="image"></span></button>
          <button class="chip" data-filter="pinned" aria-pressed="false">Pinned<span class="count" data-count="pinned"></span></button>
        </div>
      </div>
      <div class="result-count" id="resultCount" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>

    <div id="pauseBanner" class="pause-banner hidden" role="status">
      <span class="pause-copy"><span class="dot paused" aria-hidden="true"></span>Capture is paused. New copies are not saved.</span>
      <button type="button" id="btnResume" class="banner-action">Resume</button>
    </div>

    <div id="list" class="list" tabindex="0" role="listbox" aria-label="Clipboard history"></div>

    <div id="empty" class="empty hidden">
      <div class="empty-art" id="emptyArt"></div>
      <p id="emptyText">Nothing copied yet.</p>
      <p class="muted tiny" id="emptyHint"></p>
    </div>

    <footer class="footer">
      <div class="footer-meta">
        <span id="counts" class="tiny"></span>
        <span id="retentionNote" class="tiny"></span>
      </div>
      <div class="footer-actions">
        <button id="btnPause" class="link-btn">Pause capture</button>
        <button id="btnClear" class="link-btn danger">Clear all</button>
      </div>
    </footer>
  </section>

  <section id="settingsScreen" class="settings hidden">
    <div class="settings-scroll">
      <header class="settings-head">
        <h2>Settings</h2>
      </header>

      <div class="card">
        <h3>Panel</h3>
        <label class="set-row">
          <span>
            <span class="row-label">Pin bubble on screen</span>
            <span class="row-help">Shows the launcher when the panel is closed.</span>
          </span>
          <input id="setBubblePinned" type="checkbox" />
        </label>
        <label class="set-row">
          <span class="row-label">Show or hide</span>
          <input id="setHotkey" type="text" spellcheck="false" placeholder="Control+Shift+V" aria-label="Toggle panel hotkey" />
        </label>
        <p class="field-note" id="hotkeyStatus"></p>

        <label class="set-row">
          <span class="row-label">Density</span>
          <select id="setDensity" aria-label="Density">
            <option value="comfortable">Comfortable</option>
            <option value="compact">Compact</option>
          </select>
        </label>

        <label class="set-row">
          <span>
            <span class="row-label">Hide when unfocused</span>
            <span class="row-help">Closes when focus leaves.</span>
          </span>
          <input id="setHideOnBlur" type="checkbox" />
        </label>

        <label class="set-row">
          <span>
            <span class="row-label">Hide after copy</span>
            <span class="row-help">Closes after copying an entry.</span>
          </span>
          <input id="setHideOnRestore" type="checkbox" />
        </label>

        <label class="set-row">
          <span class="row-label">Start at sign-in</span>
          <input id="setAutoStart" type="checkbox" />
        </label>
        <p class="field-note" id="autoStartNote"></p>
      </div>

      <div class="card">
        <h3>History</h3>
        <label class="set-row">
          <span>
            <span class="row-label">Max entries</span>
            <span class="row-help">Pinned items are kept.</span>
          </span>
          <input id="setMax" type="number" min="20" max="2000" step="10" aria-label="Max entries" />
        </label>

        <label class="set-row">
          <span class="row-label">Capture images</span>
          <input id="setCaptureImages" type="checkbox" />
        </label>

        <label class="set-row">
          <span>
            <span class="row-label">Auto-lock</span>
            <span class="row-help">Idle minutes. 0 stays unlocked.</span>
          </span>
          <input id="setAutoLock" type="number" min="0" max="240" step="1" aria-label="Auto-lock after minutes" />
        </label>

        <label class="set-row">
          <span>
            <span class="row-label">Auto-delete</span>
            <span class="row-help">Hours. 0 keeps unpinned items.</span>
          </span>
          <input id="setRetention" type="number" min="0" max="8760" step="1" aria-label="Auto-delete after hours" />
        </label>
      </div>

      <div class="card">
        <h3>Screenshots</h3>
        <label class="set-row">
          <span class="row-label">Region hotkey</span>
          <input id="setShotHotkey" type="text" spellcheck="false" placeholder="Control+Shift+S" aria-label="Screenshot hotkey" />
        </label>
        <p class="field-note" id="shotHotkeyStatus"></p>

        <label class="set-row">
          <span>
            <span class="row-label">Save a copy</span>
            <span class="row-help">Also saves to Pictures/NextClip.</span>
          </span>
          <input id="setAutoSaveShots" type="checkbox" />
        </label>
        <div class="btn-row">
          <button id="btnShotNow" class="quiet-btn" type="button">Take a screenshot</button>
          <button id="btnOpenShotDir" class="quiet-btn" type="button">Open screenshots folder</button>
        </div>
      </div>

      <div class="card stack">
        <h3>Passphrase</h3>
        <p class="field-note">Re-encrypts every entry.</p>
        <input id="passCurrent" type="password" placeholder="Current passphrase" aria-label="Current passphrase" autocomplete="current-password" spellcheck="false" />
        <input id="passNew" type="password" placeholder="New passphrase (min 6)" aria-label="New passphrase" autocomplete="new-password" spellcheck="false" />
        <input id="passNew2" type="password" placeholder="Repeat new passphrase" aria-label="Repeat new passphrase" autocomplete="new-password" spellcheck="false" />
        <button id="btnChangePass" class="primary" type="button">Update passphrase</button>
        <p id="settingsMessage" class="field-note" role="status" aria-live="polite"></p>
      </div>
    </div>

    <div class="settings-footer">
      <button id="btnReveal" class="link-btn" type="button">Show vault file</button>
      <button id="btnDone" class="primary" type="button">Done</button>
    </div>
  </section>

  <div id="toast" class="toast hidden">
    <span id="toastText" role="status" aria-live="polite" aria-atomic="true"></span>
    <button id="toastAction" class="toast-action hidden" type="button"></button>
  </div>

  <div id="rowMenu" class="row-menu hidden" role="menu"></div>

  <script src="app.js"></script>
</body>
</html>
